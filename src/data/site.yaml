  en: Department of Mechanical Engineering, Pusan National University
  ko: 부산대학교 기계공학부

# 홈 첫 화면의 큰 문장
tagline:
  en: Wireless robots for minimally invasive medicine.
  ko: 최소침습 의료를 위한 무선 로봇을 연구합니다.

# 홈 첫 화면의 설명 문단
mission:
  en: >-
    We combine magnetics, soft materials, mechanics and machine learning to build
    a new class of wireless medical robots — through novel designs, non-invasive
    actuation methods, and learning & control algorithms that minimize the
    invasiveness of diagnostic and surgical procedures.
  ko: >-
    자기장, 소프트 소재, 기계설계, 기계학습을 아우르는 다중물리 접근으로 새로운 무선 의료 로봇을 연구합니다.
    새로운 설계, 비침습적 구동 방법, 학습·제어 알고리즘을 통해 진단과 수술의 침습성을 최소화하는 것이 목표입니다.

